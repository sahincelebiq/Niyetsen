[build]
builder = "DOCKERFILE"
# Dockerfile.cron = API imajı + postgresql-client-17 (günlük pg_dump yedeği, V2 §7.1)
dockerfilePath = "Dockerfile.cron"

[deploy]
startCommand = "python scripts/run_scheduled_jobs.py"
# Railway dashboard → Config-as-code path: /railway.cron.toml (railway.toml DEĞİL)
cronSchedule = "*/5 * * * *"
restartPolicyType = "NEVER"
